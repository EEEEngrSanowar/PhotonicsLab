<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outreach &amp; Gallery | UND GLIDE Lab</title>
<meta name="description" content="Lab outings, community activities, and moments from UND GLIDE Lab.">
<link rel="stylesheet" href="css/style.css">
<style>
  .photo-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    margin-top: 24px;
  }
  .photo-card {
    background: var(--card-bg, #fff);
    border: 1px solid var(--border, #e2e8f0);
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .photo-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 28px rgba(0,0,0,0.08);
  }
  .photo-card img {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    display: block;
  }
  .photo-card .caption {
    padding: 14px 18px;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .photo-card .caption .date {
    display: block;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--primary, #009A44);
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body data-page="outreach">

<section class="hero" style="padding:70px 24px;">
  <div class="container">
    <h1>Outreach &amp; Gallery</h1>
    <p>Lab outings, community engagement, and moments from GLIDE Lab life.</p>
  </div>
</section>

<section class="section">
  <div class="container">

    <div class="photo-gallery">

      <div class="photo-card">
        <img src="Images/Outreach Page/pic1.jpg" alt="GLIDE Lab at Scooter's Coffee">
        <div class="caption">
          <span class="date">AUGUST 2026</span>
          Coffee, conversation, and good company — GLIDE Lab members at Scooter's Coffee.
        </div>
      </div>

      <div class="photo-card">
        <img src="outreach2.jpg" alt="Lab outing">
        <div class="caption">
          <span class="date">AUGUST 2026</span>
          Add caption here.
        </div>
      </div>

      <div class="photo-card">
        <img src="outreach3.jpg" alt="Lab outing">
        <div class="caption">
          <span class="date">AUGUST 2026</span>
          Add caption here.
        </div>
      </div>

    </div>

  </div>
</section>

<script src="js/script.js"></script>
</body>
</html>
